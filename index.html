<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .photo-box {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 开启 GPU 硬件加速与渲染优化 */
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .photo-box img {
            width: 66.7vw; /* 缩小三分之一 */
            max-height: 66.7vh;
            object-fit: contain;
            display: block;
            pointer-events: none;
            transform: translateZ(0); /* 强制图片独立图层渲染 */
        }
    </style>
</head>
<body>

    <div class="viewport" id="viewport">
        <div class="photo-box" id="track1"><img src="images/wwwwwww.jpg" alt="wwwwwww"></div>
        <div class="photo-box" id="track2"><img src="images/wwwwwww.jpg" alt="wwwwwww"></div>
        <div class="photo-box" id="track3"><img src="images/wwwwwww.jpg" alt="wwwwwww"></div>
    </div>

    <script>
        const tracks = [
            document.getElementById('track1'),
            document.getElementById('track2'),
            document.getElementById('track3')
        ];

        let totalHeight = window.innerHeight;
        let currentScrollY = totalHeight; 
        let targetScrollY = totalHeight;

        // 优化滚轮响应
        window.addEventListener('wheel', (e) => {
            targetScrollY += e.deltaY * 0.55; 
            e.preventDefault();
        }, { passive: false });

        // 优化触控响应
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const deltaY = touchStartY - touchY;
            targetScrollY += deltaY * 1.1;
            touchStartY = touchY;
            e.preventDefault();
        }, { passive: false });

        function animate() {
            // 提高插值响应速度，消除拖泥带水感
            currentScrollY += (targetScrollY - currentScrollY) * 0.2;

            // 完美的无缝循环边界控制
            if (currentScrollY >= totalHeight * 2) {
                currentScrollY -= totalHeight;
                targetScrollY -= totalHeight;
            } else if (currentScrollY <= 0) {
                currentScrollY += totalHeight;
                targetScrollY += totalHeight;
            }

            // 使用 translate3d 强制走独立图层和 GPU 渲染，彻底杜绝掉帧和卡顿
            const y1 = 0 - currentScrollY;
            const y2 = totalHeight - currentScrollY;
            const y3 = totalHeight * 2 - currentScrollY;

            tracks[0].style.transform = `translate3d(0, ${y1}px, 0)`;
            tracks[1].style.transform = `translate3d(0, ${y2}px, 0)`;
            tracks[2].style.transform = `translate3d(0, ${y3}px, 0)`;

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            totalHeight = window.innerHeight;
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
