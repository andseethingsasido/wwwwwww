<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000; /* 纯黑背景 */
            overflow: hidden; /* 隐藏默认滚动条，由自定义JS接管平滑无缝滚动 */
        }

        /* 滚动视口容器 */
        .viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 照片容器：尺寸缩小三分之一（即原尺寸的约66.7%） */
        .photo-box {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        .photo-box img {
            width: 66.7vw; /* 宽度缩小三分之一 */
            max-height: 66.7vh; /* 高度限制在视口的 66.7% 内 */
            object-fit: contain;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="viewport" id="viewport">
        <!-- 为了实现无缝循环，我们在页面中渲染 3 个相同的照片轨道 -->
        <div class="photo-box" id="track1"><img src="images/wwwwwww.jpg" alt="wwwwwww"></div>
        <div class="photo-box" id="track2"><img src="images/wwwwwww.jpg" alt="wwwwwww"></div>
        <div class="photo-box" id="track3"><img src="images/wwwwwww.jpg" alt="wwwwwww"></div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const tracks = [
            document.getElementById('track1'),
            document.getElementById('track2'),
            document.getElementById('track3')
        ];

        let totalHeight = window.innerHeight;
        let currentScrollY = totalHeight; // 初始停留在中间轨道
        let targetScrollY = totalHeight;

        // 监听鼠标滚轮事件
        window.addEventListener('wheel', (e) => {
            targetScrollY += e.deltaY * 0.8; // 调节滚动速度
            e.preventDefault();
        }, { passive: false });

        // 监听触控板/手机滑动事件
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const deltaY = touchStartY - touchY;
            targetScrollY += deltaY * 1.2;
            touchStartY = touchY;
            e.preventDefault();
        }, { passive: false });

        // 平滑动画循环与无缝坐标重置
        function animate() {
            // 缓动算法 (Lerp)，让滚动丝滑跟随
            currentScrollY += (targetScrollY - currentScrollY) * 0.1;

            // 无缝循环的核心逻辑：当滚动超出上下边界时，瞬间把目标位置拉回中间，实现无限循环
            if (currentScrollY >= totalHeight * 2) {
                currentScrollY -= totalHeight;
                targetScrollY -= totalHeight;
            } else if (currentScrollY <= 0) {
                currentScrollY += totalHeight;
                targetScrollY += totalHeight;
            }

            // 让 3 个轨道错开排列，实现循环滚动展示
            tracks[0].style.transform = `translateY(${0 - currentScrollY}px)`;
            tracks[1].style.transform = `translateY(${totalHeight - currentScrollY}px)`;
            tracks[2].style.transform = `translateY(${totalHeight * 2 - currentScrollY}px)`;

            requestAnimationFrame(animate);
        }

        // 窗口大小改变时自适应高度
        window.addEventListener('resize', () => {
            totalHeight = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
