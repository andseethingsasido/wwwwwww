<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-x: hidden;
            overflow-y: auto; /* 恢复原生顺滑滚动条 */
            -webkit-overflow-scrolling: touch; /* 手机端惯性滚动 */
        }

        /* 隐藏默认滚动条但保持滚动 */
        body::-webkit-scrollbar {
            display: none;
        }

        .page-container {
            width: 100vw;
            height: 300vh; /* 三倍高度提供滚动空间 */
            position: relative;
        }

        .photo-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0);
        }

        .photo-box img {
            width: 66.7vw; /* 缩小三分之一 */
            max-height: 66.7vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div class="page-container" id="container">
        <div class="photo-box" id="photoBox">
            <img src="images/wwwwwww.jpg" alt="wwwwwww">
        </div>
    </div>

    <script>
        const photoBox = document.getElementById('photoBox');
        let winHeight = window.innerHeight;

        // 利用原生滚动位置直接计算位移，零延迟、绝对不卡顿
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // 无限循环核心：当滚动到接近顶部或底部时，无感重置原生滚动位置
            if (scrollTop >= winHeight * 2) {
                window.scrollTo(0, scrollTop - winHeight);
            } else if (scrollTop <= 0) {
                window.scrollTo(0, scrollTop + winHeight);
            }
        }, { passive: true });

        window.addEventListener('resize', () => {
            winHeight = window.innerHeight;
        });

        // 初始让页面停在中间区域
        window.scrollTo(0, winHeight);
    </script>
</body>
</html>
