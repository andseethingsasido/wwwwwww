<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDSEETHINGSASIDO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            background-color: #000;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 隐藏默认滚动条但保持丝滑滚动 */
        body::-webkit-scrollbar {
            display: none;
        }

        /* 下层背景照片流容器 */
        .background-flow {
            width: 100vw;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1; /* 处于下层 */
        }

        /* 每张背景照片铺满整个视口 */
        .bg-photo {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* 铺满屏幕，保持比例 */
            display: block;
        }

        /* 上层居中固定的 logo / 照片容器 */
        .fixed-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 让鼠标事件穿透，不影响下层的滚动 */
            z-index: 10; /* 确保悬浮在最上层 */
        }

        /* 锁死尺寸为 50vw / 50vh 的居中图形 */
        .fixed-overlay img {
            width: 50vw;
            height: 50vh;
            object-fit: contain;
            display: block;
            will-change: transform;
            transform: translateZ(0); /* 开启 GPU 加速防卡顿 */
        }
    </style>
</head>
<body>

    <!-- 上层：居中固定显示的 wwwwwww.png，尺寸 50vw / 50vh -->
    <div class="fixed-overlay">
        <img src="images/wwwwwww.png" alt="wwwwwww">
    </div>

    <!-- 下层：正常铺满屏幕并可上下滚动的背景照片 (shu.jpg 和 and.jpg) -->
    <div class="background-flow">
        <img class="bg-photo" src="images/shu.jpg" alt="shu">
        <img class="bg-photo" src="images/and.jpg" alt="and">
        <!-- 如果需要无限循环或者更多照片，可以在这里继续添加 -->
        <img class="bg-photo" src="images/shu.jpg" alt="shu">
        <img class="bg-photo" src="images/and.jpg" alt="and">
    </div>

</body>
</html>
