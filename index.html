<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            background-color: #000;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 隐藏默认滚动条 */
        body::-webkit-scrollbar {
            display: none;
        }

        /* 下层背景照片流容器 */
        .background-flow {
            width: 100vw;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* 背景照片：宽度100vw左右铺满，高度自适应原始比例，上下无缝拼接 */
        .bg-photo {
            width: 100vw;
            height: auto;
            display: block;
        }

        /* 上层居中固定的 wwwwwww.jpg (尺寸 50vw / 50vh) */
        .fixed-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 鼠标事件穿透，不影响下层滚动 */
            z-index: 10;
        }

        .fixed-overlay img {
            width: 50vw;
            height: 50vh;
            object-fit: contain;
            display: block;
            transform: translateZ(0); /* 开启 GPU 硬件加速 */
        }
    </style>
</head>
<body>

    <!-- 上层：固定居中的 wwwwwww.jpg -->
    <div class="fixed-overlay">
        <img src="images/wwwwwww.jpg" alt="wwwwwww">
    </div>

    <!-- 下层：左右铺满屏幕，and.jpg 在上、shu.jpg 在下交替循环 -->
    <div class="background-flow">
        <img class="bg-photo" src="images/and.jpg" alt="and">
        <img class="bg-photo" src="images/shu.jpg" alt="shu">
        <img class="bg-photo" src="images/and.jpg" alt="and">
        <img class="bg-photo" src="images/shu.jpg" alt="shu">
    </div>

</body>
</html>
