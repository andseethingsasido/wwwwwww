<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 隐藏默认滚动条但保持丝滑滚动 */
        body::-webkit-scrollbar {
            display: none;
        }

        .page-container {
            width: 100vw;
            height: 300vh; /* 三倍高度提供无缝循环滚动空间 */
            position: relative;
        }

        .photo-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .photo-box img {
            width: 50vw; /* 缩小至二分之一大小 */
            max-height: 50vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div class="page-container" id="container">
        <div class="photo-box" id="photoBox">
            <img src="images/wwwwwww.jpg" alt="wwwwwww">
        </div>
    </div>

    <script>
        const photoBox = document.getElementById('photoBox');
        let winHeight = window.innerHeight;

        function updateScroll() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            // 让图片位置跟随滚动产生自然的位移反馈，彻底解决“无法滑动”的问题
            // 同时利用多出来的滚动空间实现视觉平移
            let offsetY = (scrollTop - winHeight);
            photoBox.style.transform = `translate3d(0, ${-offsetY}px, 0)`;

            // 无限循环核心：当滚动到接近顶部或底部时，无感重置原生滚动位置，实现无限上下循环
            if (scrollTop >= winHeight * 2) {
                window.scrollTo(0, scrollTop - winHeight);
            } else if (scrollTop <= 0) {
                window.scrollTo(0, scrollTop + winHeight);
            }
        }

        window.addEventListener('scroll', updateScroll, { passive: true });

        window.addEventListener('resize', () => {
            winHeight = window.innerHeight;
        });

        // 初始让页面停在中间区域
        window.scrollTo(0, winHeight);
    </script>
</body>
</html>
